# GRPO 强化精修配置（trl GRPOTrainer）
base_model: Qwen/Qwen3.5-4B
sft_adapter: output/qwen35_lora_vllm        # GRPO 起点：SFT 产出的 LoRA
train_jsonl: data/train.jsonl
output_dir: output/qwen35_grpo

# LoRA
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

# GRPO 超参
num_generations: 8
temperature: 1.0
max_prompt_length: 256
max_completion_length: 256
beta: 0.04
learning_rate: 2.0e-6
num_train_epochs: 1
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
logging_steps: 5
save_steps: 100
align: positional                            # 奖励对齐方式：positional | greedy

# vLLM rollout（server 模式，GPU1）
use_vllm: true
vllm_mode: server
vllm_server_host: 127.0.0.1
vllm_server_port: 8000
